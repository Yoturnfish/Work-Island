name: macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'Specs/**', 'Package.swift', 'AppResources/**', 'scripts/**', '.github/workflows/ci.yml']
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Tests
        run: swift test
      - name: Release build
        run: swift build -c release
